kind = "web"
previewPath = "/"
title = "Aura CRM"
description = "Учет товаров и торговых операций ювелирного магазина с подготовкой и печатью этикеток на Niimbot B1."
version = "1.0.0"
id = "artifacts/aura-crm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25038

[services.development]
run = "pnpm --filter @workspace/aura-crm run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/aura-crm", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/aura-crm", "run", "start"]

[services.production.run.env]
PORT = "25038"
NODE_ENV = "production"

[services.env]
PORT = "25038"
BASE_PATH = "/"
