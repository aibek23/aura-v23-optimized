name: Lockfile portability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Intentionally no npm install: detect inaccessible registry URLs first.
      - run: node --test tests/lockfile-registry.test.mjs
